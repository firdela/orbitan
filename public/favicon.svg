<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Orbitan">
  <!-- Orbit Ring — 6-R Operating Cycle brand element (original vector, not a logo redraw) -->
  <circle cx="32" cy="32" r="30" fill="#0A0F1A"/>
  <!-- Renew — Green -->
  <path d="M 32 4 A 28 28 0 0 1 56.12 17.5" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round"/>
  <!-- Relate — Blue -->
  <path d="M 58.5 24.5 A 28 28 0 0 1 58.5 39.5" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <!-- Respond — Orange -->
  <path d="M 56.12 46.5 A 28 28 0 0 1 32 60" fill="none" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
  <!-- Refine — Violet -->
  <path d="M 24.5 58.5 A 28 28 0 0 1 10.38 50.5" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
  <!-- Regulate — Red -->
  <path d="M 7.88 46.5 A 28 28 0 0 1 7.88 17.5" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
  <!-- Reach — Gold -->
  <path d="M 10.38 13.5 A 28 28 0 0 1 24.5 5.5" fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round"/>
  <!-- Inner circle (subtle ring) -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.5"/>
</svg>
